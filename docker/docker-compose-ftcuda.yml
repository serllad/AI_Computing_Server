services:
  bisheng-ft:
    build:
      dockerfile: ./docker/docker-cuda/Dockerfile
      context: ../..
      args:
        INSTALL_BNB: true
        INSTALL_VLLM: false
        INSTALL_DEEPSPEED: true
        INSTALL_FLASHATTN: false
        INSTALL_LIGER_KERNEL: false
        INSTALL_HQQ: false
        INSTALL_EETQ: false
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: bisheng-ft:latest
    container_name: bisheng-ft-server
    volumes:
      - ../../hf_cache:/root/.cache/huggingface
      - ../../ms_cache:/root/.cache/modelscope
      - ../../om_cache:/root/.cache/openmind
      - ../../data:/app/data
      - ../../output:/app/output
      - ./bisheng-ft/config.yaml:/opt/bisheng-ft/sft_server/config.yaml
      - ./data/llm:/opt/bisheng-ft/models/model_repository
    ports:
      - "8000:8000"
    ipc: host
    tty: true
    stdin_open: true
    command: bash start-sft-server.sh
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: "all"
            capabilities: [gpu]
    restart: unless-stopped
    networks:
      - bisheng_default

networks:
  bisheng_default:
    external: true
